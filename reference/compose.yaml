services:
  postgres:
    image: postgres:16-alpine
    # Local reference database only. This password is not a secret and must not be reused.
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: stackinspect
      POSTGRES_DB: stackinspect
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stackinspect"]
      interval: 1s
      timeout: 3s
      retries: 30
