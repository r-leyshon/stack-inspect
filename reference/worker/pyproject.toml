[project]
name = "stack-inspect-reference-worker"
version = "1.1.0"
description = "Reference jobs API and worker, so a second process shows its own lane"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "sqlalchemy>=2",
  "stack-inspect-core",
  "stack-inspect-db",
  "stack-inspect-fastapi",
  "uvicorn>=0.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reference_worker"]
