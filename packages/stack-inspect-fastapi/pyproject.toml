[project]
name = "stack-inspect-fastapi"
version = "1.0.0"
description = "Development-only ASGI adapter that records FastAPI and Starlette apps"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["stack-inspect-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stack_inspect_fastapi"]
