[project]
name = "stack-inspect-db"
version = "1.2.0"
description = "Development-only adapter that records SQL from asyncpg and SQLAlchemy"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["stack-inspect-core"]

[project.optional-dependencies]
asyncpg = ["asyncpg>=0.30"]
sqlalchemy = ["sqlalchemy>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stack_inspect_db"]
