<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <title>stack-inspect</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #121418;
      --panel: #181c22;
      --line: #2a3038;
      --text: #e8e4da;
      --muted: #8d939c;
      --browser: #8eb6ff;
      --next: #d4b4ff;
      --api: #6ee7d2;
      --db: #f0c36a;
      --accent: #e7a06a;
      font-family: ui-sans-serif, system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
    body {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr) 320px;
      grid-template-rows: auto minmax(0, 1fr);
      height: 100vh;
    }
    header {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.7rem 1rem;
      border-bottom: 1px solid var(--line);
    }
    #reset { margin-left: 0; }
    header h1 { font-size: 0.95rem; font-weight: 600; margin: 0; letter-spacing: 0.01em; }
    header p { margin: 0; color: var(--muted); font-size: 0.8rem; }
    .live { width: 0.45rem; height: 0.45rem; border-radius: 50%; background: var(--api); display: inline-block; margin-right: 0.35rem; }
    aside, main { min-height: 0; min-width: 0; }
    #traces-panel, #findings-panel { background: var(--panel); overflow: auto; }
    #traces-panel { border-right: 1px solid var(--line); }
    #traces-panel, #findings-panel, #timeline-wrap { position: relative; }
    #findings-panel { border-left: 1px solid var(--line); }
    h2 {
      margin: 0;
      padding: 0.75rem 0 0.35rem;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
    }
    .section-title {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 0.55rem 0.65rem 0 0.9rem;
    }
    .section-title h2 { padding-left: 0; }
    .info.panel-help {
      position: static;
      margin-top: 0.45rem;
    }
    .hint { position: relative; display: inline-flex; }
    header .hint { margin-left: 0; }
    .info {
      position: absolute;
      top: -0.4rem;
      right: -0.4rem;
      z-index: 2;
      width: 0.95rem;
      height: 0.95rem;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--muted);
      font: inherit;
      font-size: 0.62rem;
      line-height: 1;
      padding: 0;
    }
    .info:hover { color: var(--text); border-color: var(--text); }
    #help {
      position: fixed;
      z-index: 5;
      max-width: 280px;
      background: #1c222b;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0.6rem 0.7rem;
      font-size: 0.78rem;
      line-height: 1.45;
      color: var(--text);
      pointer-events: none;
    }
    #help[hidden] { display: none; }
    ul { list-style: none; margin: 0; padding: 0 0.45rem 1rem; }
    #traces li button, .finding {
      width: 100%;
      text-align: left;
      background: transparent;
      color: inherit;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 0.45rem 0.5rem;
      cursor: pointer;
      font: inherit;
    }
    #traces li button:hover, .finding:hover, #traces li button[aria-pressed="true"], .finding[aria-expanded="true"] {
      background: #222831;
      border-color: var(--line);
    }
    .title { display: block; font-size: 0.86rem; }
    .meta { display: block; color: var(--muted); font-size: 0.72rem; margin-top: 0.15rem; }
    .names { display: block; color: var(--muted); font-size: 0.68rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chips { display: flex; gap: 0.25rem; margin-top: 0.3rem; flex-wrap: wrap; }
    .chip {
      font-size: 0.65rem;
      border-radius: 999px;
      padding: 0.05rem 0.4rem;
      border: 1px solid var(--line);
      color: var(--text);
    }
    main { display: grid; grid-template-rows: minmax(168px, 32%) minmax(0, 1fr); }
    #timeline-wrap, #graph-wrap { min-height: 0; position: relative; }
    #timeline-wrap { border-bottom: 1px solid var(--line); display: flex; flex-direction: column; }
    #tracks { grid-column: 1 / -1; grid-row: 2; overflow: auto; min-height: 0; min-width: 0; display: flex; flex-direction: column; }
    #arrange {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr);
      grid-template-rows: 28px minmax(0, 1fr);
      position: relative;
      background: #0e1116;
      border-top: 1px solid var(--line);
    }
    .arrange-corner { grid-column: 1; grid-row: 1; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: #14181e; }
    #ruler {
      grid-column: 2;
      grid-row: 1;
      position: relative;
      cursor: ew-resize;
      border-bottom: 1px solid var(--line);
      background: #161b22;
      overflow: hidden;
    }
    .tick {
      position: absolute;
      top: 0;
      height: 100%;
      border-left: 1px solid #ffffff22;
      color: var(--muted);
      font-size: 0.62rem;
      padding: 0.35rem 0 0 0.28rem;
      white-space: nowrap;
    }
    .lane { display: grid; width: 100%; grid-template-columns: 92px minmax(0, 1fr); align-items: stretch; flex: 1 1 0; min-height: 52px; border-bottom: 1px solid #ffffff10; }
    .lane-label { font-size: 0.72rem; color: var(--muted); padding: 0.45rem 0.55rem; background: #14181e; border-right: 1px solid var(--line); display: flex; align-items: center; }
    .track {
      position: relative;
      width: 100%;
      min-width: 0;
      height: 100%;
      min-height: 52px;
      background-color: #10141a;
      background-image: repeating-linear-gradient(90deg, transparent, transparent calc(12.5% - 1px), #ffffff12 12.5%);
    }
    .timeline-actions { display: flex; align-items: center; gap: 0.55rem; }
    .timeline-actions .info.panel-help { margin-top: 0; }
    .transport-deck {
      --transport-ease: cubic-bezier(0.22, 1, 0.36, 1);
      display: flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.2rem 0.65rem 0.2rem 0.2rem;
      border-radius: 999px;
      background: linear-gradient(180deg, #141920, #0c1016);
      border: 1px solid #2a323c;
      box-shadow: inset 0 1px 0 #ffffff0a;
    }
    #restart,
    #transport {
      border: 0;
      border-radius: 50%;
      padding: 0;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition:
        transform 0.16s var(--transport-ease),
        background 0.36s var(--transport-ease),
        color 0.36s var(--transport-ease),
        box-shadow 0.36s var(--transport-ease);
    }
    #restart {
      width: 1.85rem;
      height: 1.85rem;
      background: #ece7dc;
      color: #14181e;
      box-shadow:
        inset 0 -1px 0 #00000018,
        inset 0 1px 0 #ffffff66;
    }
    #restart:hover {
      background: #fffaf0;
      transform: scale(1.05);
    }
    #restart:active { transform: scale(0.95); }
    #restart .transport-svg { width: 0.95rem; height: 0.95rem; }
    #transport {
      width: 2.15rem;
      height: 2.15rem;
      background: #ff8a3d;
      color: #14181e;
      box-shadow:
        inset 0 -1px 0 #00000028,
        inset 0 1px 0 #ffffff33;
    }
    #transport:hover { transform: scale(1.05); }
    #transport:active { transform: scale(0.95); }
    #transport[aria-pressed="true"] {
      background: #ece7dc;
      box-shadow:
        inset 0 -1px 0 #00000018,
        inset 0 1px 0 #ffffff66;
    }
    .transport-svg {
      width: 1rem;
      height: 1rem;
      display: block;
      overflow: visible;
    }
    .transport-svg .glyph {
      fill: currentColor;
      transform-origin: 12px 12px;
      transition:
        transform 0.42s var(--transport-ease),
        opacity 0.28s ease;
    }
    /* Idle: crisp play triangle, pause bars tucked away. */
    #transport[aria-pressed="false"] .glyph-play {
      opacity: 1;
      transform: translateX(0.5px) scale(1) rotate(0deg);
    }
    #transport[aria-pressed="false"] .glyph-pause {
      opacity: 0;
      transform: scale(0.45) rotate(-80deg);
      pointer-events: none;
    }
    /* Playing: pause bars settle in, triangle leaves. */
    #transport[aria-pressed="true"] .glyph-play {
      opacity: 0;
      transform: scale(0.45) rotate(80deg);
      pointer-events: none;
    }
    #transport[aria-pressed="true"] .glyph-pause {
      opacity: 1;
      transform: scale(1) rotate(0deg);
    }
    #transport[aria-pressed="true"] .glyph-pause .blade {
      transform-box: fill-box;
      transform-origin: center;
      animation: transport-blade-in 0.42s var(--transport-ease) both;
    }
    #transport[aria-pressed="true"] .glyph-pause .blade-b {
      animation-delay: 0.04s;
    }
    @keyframes transport-blade-in {
      from { transform: scaleY(0.35); opacity: 0.4; }
      to { transform: scaleY(1); opacity: 1; }
    }
    #timecode {
      font-variant-numeric: tabular-nums;
      font-size: 0.72rem;
      color: #a7adb6;
      letter-spacing: 0.04em;
      min-width: 11.5rem;
    }
    .bar.upcoming { opacity: 0; min-width: 0; padding: 0; pointer-events: none; }
    .bar.quiet { opacity: 0.34; }
    .bar.here { box-shadow: inset 0 0 0 1px #ffffffcc; }
    #playhead {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 0;
      border-left: 1px solid #ff8a3d;
      z-index: 4;
      pointer-events: none;
    }
    #playhead[hidden] { display: none; }
    .playhead-cap {
      pointer-events: auto;
      position: absolute;
      top: 3px;
      left: -7px;
      width: 14px;
      height: 12px;
      background: #ff8a3d;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      cursor: ew-resize;
    }
    .bar {
      position: absolute;
      top: 50%;
      height: 22px;
      margin-top: -11px;
      border: 0;
      border-radius: 4px;
      color: #121418;
      font-size: 0.68rem;
      padding: 0 0.35rem;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      cursor: pointer;
      min-width: 0;
    }
    #graph-wrap {
      background: radial-gradient(circle at 50% 40%, #1b2129, #101318 70%);
      display: flex;
      flex-direction: column;
    }
    .graph-help {
      position: absolute;
      top: 0.45rem;
      right: 0.55rem;
      z-index: 3;
    }
    #stage { position: relative; flex: 1; min-height: 0; }
    #graph, #sequence { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #graph { cursor: grab; }
    #graph.dragging, #sequence.dragging { cursor: grabbing; }
    #sequence { overflow: hidden; cursor: grab; touch-action: none; }
    #sequence svg { width: 100%; height: 100%; display: block; }
    #sequence text { font-family: ui-sans-serif, system-ui, sans-serif; }
    #graph-wrap[data-view="graph"] #sequence { visibility: hidden; pointer-events: none; }
    #graph-wrap[data-view="sequence"] #graph { visibility: hidden; pointer-events: none; }
    .graph-tools {
      display: flex;
      gap: 0.55rem 0.7rem;
      flex-wrap: wrap;
      align-items: flex-start;
      padding: 0.85rem 0.85rem 0.35rem;
    }
    .layer-group { display: inline-flex; gap: 0.4rem; }
    input[type="search"], .tool {
      background: #12161ccc;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.28rem 0.7rem;
      font: inherit;
      font-size: 0.75rem;
    }
    input[type="search"] { width: 180px; }
    .tool[aria-pressed="true"] { border-color: var(--text); }
    .tool { cursor: pointer; }
    .header-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }
    .menu { position: relative; }
    .menu-panel {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      z-index: 6;
      min-width: 11rem;
      background: #1c222b;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0.35rem;
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }
    .menu-panel[hidden] { display: none; }
    .menu-panel button {
      text-align: left;
      background: transparent;
      color: var(--text);
      border: 0;
      border-radius: 6px;
      padding: 0.4rem 0.55rem;
      font: inherit;
      font-size: 0.78rem;
      cursor: pointer;
    }
    .menu-panel button:hover { background: #222831; }
    .include-events {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--muted);
      font-size: 0.75rem;
      padding: 0.4rem 0.55rem 0.25rem;
      border-top: 1px solid var(--line);
      margin-top: 0.15rem;
    }
    #tip {
      position: absolute;
      z-index: 4;
      display: none;
      max-width: 260px;
      background: #0e1116ee;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0.45rem 0.55rem;
      font-size: 0.75rem;
      pointer-events: none;
    }
    .explain { padding: 0 0.9rem 0.8rem; color: var(--muted); font-size: 0.8rem; line-height: 1.45; }
    .explain strong { color: var(--text); font-weight: 600; }
    .empty { color: var(--muted); font-size: 0.8rem; padding: 0.4rem 0.9rem; }
    .layer-browser { background: var(--browser); }
    .layer-next { background: var(--next); }
    .layer-api { background: var(--api); }
    .layer-db { background: var(--db); }
  </style>
</head>
<body>
  <header>
    <h1><span class="live"></span>stack-inspect</h1>
    <p id="status">The graph is built from the app as you use it.</p>
    <div class="header-actions">
      <button class="tool" type="button" id="read-source">Read source</button>
      <div class="menu">
        <button class="tool" type="button" id="export" aria-expanded="false" aria-controls="export-menu">Export</button>
        <div id="export-menu" class="menu-panel" hidden>
          <button type="button" data-format="md">Markdown</button>
          <button type="button" data-format="json">JSON</button>
          <label class="include-events"><input id="include-events" type="checkbox" /> Include events</label>
        </div>
      </div>
      <button class="tool" type="button" id="reset">Reset</button>
    </div>
  </header>
  <aside id="traces-panel">
    <div class="section-title">
      <h2>Traces</h2>
      <button type="button" class="info panel-help" data-help="traces" aria-label="About traces">i</button>
    </div>
    <ul id="traces"></ul>
  </aside>
  <main>
    <section id="timeline-wrap" aria-label="Timeline">
      <div class="section-title">
        <h2>Timeline</h2>
        <div class="timeline-actions">
          <div class="transport-deck">
            <button type="button" id="restart" aria-label="Restart" title="Restart">
              <svg class="transport-svg" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M6.2 5.4h2.1v13.2H6.2z" />
                <path d="M18.4 6.7a1 1 0 0 0-1.55-.84l-7.1 4.5a1 1 0 0 0 0 1.68l7.1 4.5a1 1 0 0 0 1.55-.84V6.7z" />
              </svg>
            </button>
            <button type="button" id="transport" aria-pressed="false" aria-label="Play" title="Play">
              <svg class="transport-svg" viewBox="0 0 24 24" aria-hidden="true">
                <path class="glyph glyph-play" d="M9.4 6.85a1.1 1.1 0 0 1 1.68-.93l7.35 4.55a1.1 1.1 0 0 1 0 1.86l-7.35 4.55a1.1 1.1 0 0 1-1.68-.93V6.85z" />
                <g class="glyph glyph-pause">
                  <rect class="blade blade-a" x="7" y="5.5" width="3.6" height="13" rx="1.3" />
                  <rect class="blade blade-b" x="13.4" y="5.5" width="3.6" height="13" rx="1.3" />
                </g>
              </svg>
            </button>
            <span id="timecode">Playhead at the end</span>
          </div>
          <button type="button" class="info panel-help" data-help="timeline" aria-label="About the timeline">i</button>
        </div>
      </div>
      <div id="arrange">
        <div class="arrange-corner" aria-hidden="true"></div>
        <div id="ruler" role="slider" aria-label="Timeline position" aria-valuemin="0" aria-valuemax="100" tabindex="0"></div>
        <div id="tracks"></div>
        <div id="playhead" hidden><span class="playhead-cap"></span></div>
      </div>
    </section>
    <section id="graph-wrap" data-view="graph" aria-label="Dependency graph">
      <div class="graph-tools">
        <span class="hint">
          <span class="layer-group" role="group" aria-label="Diagram">
            <button class="tool" type="button" id="view-graph" aria-pressed="true">Graph</button>
            <button class="tool" type="button" id="view-sequence" aria-pressed="false">Sequence</button>
          </span>
          <button type="button" class="info" data-help="view" aria-label="About the diagram">i</button>
        </span>
        <span class="hint">
          <input id="search" type="search" placeholder="Filter nodes" aria-label="Filter nodes" />
          <button type="button" class="info" data-help="search" aria-label="About the filter">i</button>
        </span>
        <span class="hint">
          <button class="tool" type="button" id="live" aria-pressed="true">Live</button>
          <button type="button" class="info" data-help="live" aria-label="About Live">i</button>
        </span>
        <span class="hint">
          <button class="tool" type="button" id="scope" aria-pressed="true">This trace</button>
          <button type="button" class="info" data-help="scope" aria-label="About This trace">i</button>
        </span>
        <span class="hint">
          <span class="layer-group">
            <button class="tool" type="button" data-layer="browser" aria-pressed="true">Browser</button>
            <button class="tool" type="button" data-layer="next" aria-pressed="true">Next.js</button>
            <button class="tool" type="button" data-layer="api" aria-pressed="true">API</button>
            <button class="tool" type="button" data-layer="db" aria-pressed="true">Database</button>
          </span>
          <button type="button" class="info" data-help="layers" aria-label="About the layer buttons">i</button>
        </span>
        <span class="hint">
          <button class="tool" type="button" id="assets" aria-pressed="true">Hide assets</button>
          <button type="button" class="info" data-help="assets" aria-label="About Hide assets">i</button>
        </span>
        <span class="hint">
          <button class="tool" type="button" id="names" aria-pressed="false">Names</button>
          <button type="button" class="info" data-help="names" aria-label="About Names">i</button>
        </span>
        <span class="hint">
          <button class="tool" type="button" id="fit">Fit</button>
          <button type="button" class="info" data-help="fit" aria-label="About Fit">i</button>
        </span>
      </div>
      <button type="button" class="info graph-help" data-help="graph" aria-label="About the graph">i</button>
      <div id="stage">
        <canvas id="graph"></canvas>
        <div id="sequence" aria-label="Sequence diagram"></div>
      </div>
      <div id="tip"></div>
    </section>
  <div id="help" hidden></div>
  </main>
  <aside id="findings-panel">
    <div class="section-title">
      <h2>Findings</h2>
      <button type="button" class="info panel-help" data-help="findings" aria-label="About findings">i</button>
    </div>
    <ul id="findings"></ul>
    <div id="explain" class="explain" hidden></div>
  </aside>
  <script>
    const LAYERS = [
      ["browser", "Browser", "#8eb6ff"],
      ["next", "Next.js", "#d4b4ff"],
      ["api", "API", "#6ee7d2"],
      ["db", "Database", "#f0c36a"],
    ];
    const LAYER_LABEL = Object.fromEntries(LAYERS.map(([id, label]) => [id, label]));
    const LAYER_COLOR = Object.fromEntries(LAYERS.map(([id, , color]) => [id, color]));
    const SEQUENCE_ROW = 34;
    const SEQUENCE_HEAD = 48;
    const SEQUENCE_COL = 168;
    const SEQUENCE_PAD = 36;
    const MEANING = {
      "repeated-query": "The same SQL ran several times inside one click. That is usually an N+1: the code asks for one row at a time instead of asking once.",
      "duplicate-request": "The same HTTP call was recorded more than once in this interaction. Sometimes the screen really fetched twice. Sometimes the browser, Next.js and the API each recorded the one call.",
      "cors-masked-server-error": "The API returned a server error, and that response had no Access-Control-Allow-Origin header. The browser then hides the status and the page only sees a CORS failure.",
      "rejected-preflight": "Before the real request, the browser asked whether a header or method was allowed. The API's allow-list said no, so the request never ran.",
      "unchanged-rerender": "React rendered this component again, but the props and state it displays did not change. A parent updated, and this component was carried along.",
      "large-render-subtree": "One state update was followed by a large number of renders. Some of those components may not have needed to render.",
      "effect-restarted": "An effect's dependencies kept changing, so React cancelled it and started it again.",
      "stream-reconnect": "The same stream was opened again and again in this trace. The client is dropping the connection, or opening a new one on every click.",
      "sequential-awaits": "These queries ran one after another, with no overlap and no recorded dependency between them. They may be able to run together.",
      "work-after-visible": "More work started after the result was already on screen. The person using the app was waiting on something that did not change what they could see.",
    };

    const state = {
      traces: [],
      nodes: new Map(),
      edges: [],
      findings: [],
      selected: "",
      focus: "",
      openFinding: "",
      highlight: new Set(),
      query: "",
      scope: "trace",
      live: true,
      reading: false,
      sourceNote: "",
      hideAssets: true,
      showNames: false,
      playing: false,
      cursor: null,
      playAnim: 0,
      playFrom: 0,
      playTo: 0,
      playWall: 0,
      seenAt: new Map(),
      highWater: null,
      laidOut: new Set(),
      layers: new Set(["browser", "next", "api", "db"]),
      view: "graph",
      sequenceCamera: { x: 0, y: 0, k: 1 },
      sequenceSig: "",
      sequenceModel: null,
      camera: { x: 0, y: 0, k: 1 },
      hover: "",
      drag: null,
    };

    const canvas = document.getElementById("graph");
    const tip = document.getElementById("tip");
    const context = canvas.getContext("2d");

    function escapeText(value) {
      return String(value).replace(/[&<>"']/g, (character) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      })[character]);
    }

    function isAsset(name) {
      return name.includes("/_next/") || name.includes("webpack") || name.includes("hot-update");
    }

    function traceTitle(trace) {
      const interaction = trace.spans.find((span) => span.kind === "interaction");
      if (interaction && !isAsset(interaction.name)) return interaction.name;
      const request = trace.spans.find((span) => span.kind === "request" && !isAsset(span.name));
      return request ? request.name : (trace.names[0] || "Trace");
    }

    function selectedTrace() {
      return state.traces.find((trace) => trace.traceId === state.selected) || null;
    }

    function isBackground(span) {
      return isAsset(span.name) || span.name === "GET /health" || span.kind === "middleware";
    }

    function latestActivity(trace) {
      const times = trace.spans.map((span) => span.end || span.start);
      return Math.max(trace.started || 0, ...times);
    }

    function interest(trace) {
      const layers = new Set(trace.spans.filter((span) => !isBackground(span)).map((span) => span.layer));
      const interaction = trace.spans.some((span) => span.kind === "interaction") ? 5 : 0;
      return interaction + layers.size;
    }

    function recordedTraces() {
      const useful = state.traces.filter((trace) => trace.spans.some((span) => !isBackground(span)));
      return useful.length > 0 ? useful : state.traces;
    }

    function listedTraces() {
      const chosen = recordedTraces();
      const at = cutoff();
      if (at == null) return chosen;
      return chosen.filter((trace) =>
        trace.started <= at || trace.spans.some((span) => span.start <= at)
      );
    }

    function renderTraces() {
      const list = document.getElementById("traces");
      const scroll = list.parentElement.scrollTop;
      const markup = listedTraces().map((trace) => {
        const chips = trace.layers.map((layer) =>
          `<span class="chip" style="color:${LAYER_COLOR[layer] || "inherit"}">${escapeText(LAYER_LABEL[layer] || layer)}</span>`
        ).join("");
        const pressed = trace.traceId === state.selected ? "true" : "false";
        const title = traceTitle(trace);
        const rest = [...new Set(trace.names)].filter((name) => name !== title);
        return `<li><button type="button" data-trace="${escapeText(trace.traceId)}" aria-pressed="${pressed}">` +
          `<span class="title">${escapeText(title)}</span>` +
          (rest.length ? `<span class="names">${rest.map((name) => escapeText(name)).join(" ")}</span>` : "") +
          `<span class="chips">${chips}</span></button></li>`;
      }).join("") || `<li class="empty">Use the app. Each click becomes a trace.</li>`;
      if (list.innerHTML !== markup) {
        list.innerHTML = markup;
        list.parentElement.scrollTop = scroll;
      }
    }

    function renderTimeline() {
      const host = document.getElementById("tracks");
      const ruler = document.getElementById("ruler");
      const arranged = buildArrangement();
      if (arranged.stories.length === 0) {
        host.innerHTML = `<p class="empty">Use the app. Each click becomes clips on the timeline.</p>`;
        ruler.innerHTML = "";
        placePlayhead();
        return;
      }
      const span = Math.max(1, arranged.end);
      ruler.innerHTML = Array.from({ length: 9 }, (_, index) => {
        const left = (index / 8) * 100;
        return `<span class="tick" style="left:${left}%">${formatOffset((span * index) / 8, span)}</span>`;
      }).join("");
      const quiet = state.scope === "trace" && !state.playing;
      host.innerHTML = LAYERS.map(([layer, label]) => {
        const bars = [];
        for (const story of arranged.stories) {
          for (const item of story.trace.spans) {
            if (item.layer !== layer) continue;
            const colour = LAYER_COLOR[item.layer] || "#c8c2b6";
            const start = story.displayStart + story.map.display(item.start);
            const end = story.displayStart + story.map.display(item.end || item.start);
            const classes = ["bar"];
            if (quiet && story.trace.traceId !== state.selected) classes.push("quiet");
            if (story.trace.traceId === state.selected) classes.push("here");
            bars.push(
              `<button type="button" class="${classes.join(" ")}" data-node="${escapeText(item.nodeKey)}" ` +
              `data-start="${start}" data-end="${Math.max(end, start)}" ` +
              `style="background:${colour}" title="${escapeText(item.name)}">${escapeText(item.name)}</button>`,
            );
          }
        }
        if (bars.length === 0) return "";
        return `<div class="lane"><div class="lane-label">${label}</div><div class="track">${bars.join("")}</div></div>`;
      }).join("") || `<p class="empty">Nothing timed has been recorded yet.</p>`;
      layoutClips();
      placePlayhead();
    }

    function formatOffset(milliseconds, scale) {
      const basis = scale == null ? milliseconds : scale;
      if (basis < 2000) return `${Math.round(milliseconds)}ms`;
      const total = Math.max(0, milliseconds) / 1000;
      const minutes = Math.floor(total / 60);
      const seconds = (total - minutes * 60).toFixed(1).padStart(4, "0");
      return `${minutes}:${seconds}`;
    }

    function clockOf(trace) {
      const points = [...new Set(trace.spans.flatMap((span) => [span.start, span.end || span.start]))].sort(
        (left, right) => left - right,
      );
      const displayAt = [0];
      for (let index = 1; index < points.length; index += 1) {
        displayAt.push(displayAt[index - 1] + Math.min(points[index] - points[index - 1], 80));
      }
      const raw = displayAt[displayAt.length - 1];
      const length = Math.max(raw, 28);
      const display = (time) => {
        if (points.length === 1 || time <= points[0]) return 0;
        for (let index = 1; index < points.length; index += 1) {
          if (time > points[index]) continue;
          const shown = displayAt[index] - displayAt[index - 1];
          const wall = points[index] - points[index - 1] || 1;
          return displayAt[index - 1] + ((time - points[index - 1]) / wall) * shown;
        }
        return raw;
      };
      const wall = (offset) => {
        if (points.length === 1) return points[0];
        const at = Math.min(Math.max(offset, 0), raw);
        for (let index = 1; index < displayAt.length; index += 1) {
          if (at > displayAt[index]) continue;
          const shown = displayAt[index] - displayAt[index - 1] || 1;
          const fraction = (at - displayAt[index - 1]) / shown;
          return points[index - 1] + fraction * (points[index] - points[index - 1]);
        }
        return points[points.length - 1];
      };
      return { origin: points[0], end: points[points.length - 1], length, display, wall };
    }

    function buildArrangement() {
      const ordered = recordedTraces()
        .filter((trace) => trace.spans.length > 0)
        .map((trace) => ({ trace, map: clockOf(trace) }))
        .sort((left, right) => left.map.origin - right.map.origin || left.trace.traceId.localeCompare(right.trace.traceId));
      let cursor = 0;
      const stories = ordered.map((item) => {
        const story = {
          trace: item.trace,
          map: item.map,
          displayStart: cursor,
          displayEnd: cursor + item.map.length,
        };
        cursor += item.map.length + 56;
        return story;
      });
      return { stories, end: stories.length ? stories[stories.length - 1].displayEnd : 0 };
    }

    function playheadDisplay(arranged) {
      if (state.cursor == null) return arranged.end;
      return Math.min(arranged.end, Math.max(0, state.cursor));
    }

    function wallNow() {
      const arranged = buildArrangement();
      if (arranged.stories.length === 0) return null;
      const display = playheadDisplay(arranged);
      let revealed = arranged.stories[0].map.origin;
      for (const story of arranged.stories) {
        if (display < story.displayStart) return revealed;
        if (display >= story.displayEnd) {
          revealed = Math.max(revealed, story.map.end);
          continue;
        }
        return Math.max(revealed, story.map.wall(display - story.displayStart));
      }
      return revealed;
    }

    function cutoff() {
      const at = wallNow();
      if (at == null) return null;
      if (state.cursor == null && !state.playing) {
        state.highWater = null;
        return at;
      }
      if (state.highWater == null || at + 0.5 >= state.highWater) {
        state.highWater = state.highWater == null ? at : Math.max(state.highWater, at);
        return state.highWater;
      }
      state.highWater = at;
      return at;
    }

    function placePlayhead() {
      const head = document.getElementById("playhead");
      const ruler = document.getElementById("ruler");
      const arrange = document.getElementById("arrange");
      const readout = document.getElementById("timecode");
      const arranged = buildArrangement();
      if (arranged.stories.length === 0 || ruler.getBoundingClientRect().width === 0) {
        head.hidden = true;
        readout.textContent = "No story on the timeline";
        ruler.setAttribute("aria-valuenow", "0");
        return;
      }
      const at = playheadDisplay(arranged);
      const duration = Math.max(arranged.end, 1);
      const fraction = Math.min(1, Math.max(0, at / duration));
      const rulerBox = ruler.getBoundingClientRect();
      const arrangeBox = arrange.getBoundingClientRect();
      head.hidden = false;
      head.style.left = `${rulerBox.left - arrangeBox.left + fraction * rulerBox.width}px`;
      readout.textContent = `Playhead ${formatOffset(at, duration)} of ${formatOffset(duration, duration)}`;
      ruler.setAttribute("aria-valuenow", String(Math.round(fraction * 100)));
    }

    function layoutClips() {
      const ruler = document.getElementById("ruler");
      const arranged = buildArrangement();
      const width = ruler.clientWidth;
      if (arranged.stories.length === 0) return;
      if (width === 0) {
        requestAnimationFrame(layoutClips);
        return;
      }
      const duration = Math.max(arranged.end, 1);
      const playX = (playheadDisplay(arranged) / duration) * width;
      for (const bar of document.querySelectorAll("#tracks .bar")) {
        const start = Number(bar.dataset.start);
        const end = Number(bar.dataset.end);
        const startX = (start / duration) * width;
        const endX = (Math.max(end, start) / duration) * width;
        const reached = playX + 0.5 >= startX;
        bar.classList.toggle("upcoming", !reached);
        if (!reached) {
          bar.style.left = `${startX}px`;
          bar.style.width = "0px";
          continue;
        }
        const drawn = Math.min(width, Math.max(14, endX - startX));
        const left = Math.max(0, Math.min(startX, width - drawn));
        bar.style.left = `${left}px`;
        bar.style.width = `${drawn}px`;
      }
    }

    function findingKey(finding) {
      const nodes = Array.isArray(finding.nodeKeys) ? finding.nodeKeys.join("|") : "";
      return `${finding.code}:${finding.traceId}:${nodes}:${finding.detail || ""}`;
    }

    function openFindingRecord() {
      return state.findings.find((finding) => findingKey(finding) === state.openFinding) || null;
    }

    function renderFindings() {
      const list = document.getElementById("findings");
      const explain = document.getElementById("explain");
      const at = cutoff();
      const visibleFindings = state.findings.filter((finding) => at == null || finding.at <= at);
      const markup = visibleFindings.map((finding) => {
        const key = findingKey(finding);
        const open = key === state.openFinding;
        return `<li><button type="button" class="finding" data-finding="${escapeText(key)}" data-trace="${escapeText(finding.traceId)}" aria-expanded="${open}">` +
          `<strong>${escapeText(finding.title)}</strong>` +
          `<span class="meta">${escapeText(finding.detail)}</span></button></li>`;
      }).join("") || `<li class="empty">No findings in the current log.</li>`;
      if (list.innerHTML !== markup) list.innerHTML = markup;
      const open = openFindingRecord();
      if (!open || !visibleFindings.some((finding) => findingKey(finding) === state.openFinding)) {
        explain.hidden = true;
        return;
      }
      explain.hidden = false;
      explain.innerHTML = `<strong>${escapeText(open.title)}</strong><br>${escapeText(MEANING[open.code] || open.detail)}<br><span class="meta">${escapeText(open.detail)}</span>`;
    }

    function stubNode(key) {
      const [layer, kind, ...rest] = key.split(":");
      return { nodeKey: key, layer: layer || "api", kind: kind || "request", name: rest.join(":") || key, count: 1 };
    }

    function syncGraph(graph) {
      const live = new Set();
      const incoming = [...graph.nodes];
      for (const edge of graph.edges) {
        if (!incoming.some((node) => node.nodeKey === edge.from)) incoming.push(stubNode(edge.from));
        if (!incoming.some((node) => node.nodeKey === edge.to)) incoming.push(stubNode(edge.to));
      }
      for (const node of incoming) {
        live.add(node.nodeKey);
        const current = state.nodes.get(node.nodeKey);
        if (current) {
          Object.assign(current, node);
        } else {
          const angle = hash(node.nodeKey);
          state.nodes.set(node.nodeKey, { ...node, x: Math.cos(angle) * 120, y: Math.sin(angle) * 120, vx: 0, vy: 0 });
        }
      }
      for (const key of [...state.nodes.keys()]) {
        if (!live.has(key)) state.nodes.delete(key);
      }
      state.edges = graph.edges.filter((edge) => edge.from !== edge.to);
      rebuildSeen();
    }

    function syncHighlight() {
      const open = openFindingRecord();
      state.highlight = new Set(Array.isArray(open?.nodeKeys) ? open.nodeKeys : []);
    }

    function rebuildSeen() {
      const seen = new Map();
      const note = (key, time) => {
        const current = seen.get(key);
        if (current == null || time < current) seen.set(key, time);
      };
      for (const trace of state.traces) {
        for (const span of trace.spans) note(span.nodeKey, span.start);
      }
      for (const edge of state.edges) {
        if (edge.source === "declared" || !edge.firstSeen) continue;
        note(edge.from, edge.firstSeen);
        note(edge.to, edge.firstSeen);
      }
      state.seenAt = seen;
    }

    function timedEdges() {
      const at = cutoff();
      if (at == null) return state.edges;
      return state.edges.filter((edge) => {
        if (edge.source === "declared") {
          const origin = state.seenAt.get(edge.from);
          const target = state.seenAt.get(edge.to);
          return origin != null && target != null && origin <= at && target <= at;
        }
        return (edge.firstSeen || 0) > 0 && edge.firstSeen <= at;
      });
    }

    function hash(value) {
      let total = 0;
      for (const character of value) total = (total * 33 + character.charCodeAt(0)) % 628;
      return total / 100;
    }

    function traceKeys() {
      const trace = selectedTrace();
      return new Set(trace ? trace.spans.map((span) => span.nodeKey) : []);
    }

    function nodeVisible(node) {
      const at = cutoff();
      if (at != null) {
        const seen = state.seenAt.get(node.nodeKey);
        if (seen == null || seen > at) return false;
      }
      if (!state.layers.has(node.layer)) return false;
      if (state.hideAssets && isAsset(node.name)) return false;
      if (state.query && !`${node.name} ${node.kind}`.toLowerCase().includes(state.query)) return false;
      if (state.highlight.has(node.nodeKey)) return true;
      if (state.scope === "trace") {
        const keys = traceKeys();
        if (keys.size === 0) return true;
        if (keys.has(node.nodeKey)) return true;
        return timedEdges().some((edge) =>
          (keys.has(edge.from) && edge.to === node.nodeKey) || (keys.has(edge.to) && edge.from === node.nodeKey)
        );
      }
      return true;
    }

    function visibleNodes() {
      return [...state.nodes.values()].filter(nodeVisible);
    }

    function visibleEdges() {
      const keys = new Set(visibleNodes().map((node) => node.nodeKey));
      return timedEdges().filter((edge) => keys.has(edge.from) && keys.has(edge.to));
    }

    function sequenceRows() {
      const nodes = visibleNodes();
      const byKey = new Map(nodes.map((node) => [node.nodeKey, node]));
      const covered = new Set();
      const rows = [];
      const edges = [...visibleEdges()].sort((left, right) => (left.firstSeen || 0) - (right.firstSeen || 0));
      for (const edge of edges) {
        const from = byKey.get(edge.from);
        const to = byKey.get(edge.to);
        if (!from || !to) continue;
        const origin = state.seenAt.get(edge.from) || 0;
        const target = state.seenAt.get(edge.to) || 0;
        const time = edge.source === "declared" || !edge.firstSeen ? Math.max(origin, target) : edge.firstSeen;
        rows.push({ time, from, to, edge, key: edge.to });
        covered.add(edge.from);
        covered.add(edge.to);
      }
      for (const node of nodes) {
        if (covered.has(node.nodeKey)) continue;
        rows.push({ time: state.seenAt.get(node.nodeKey) || 0, from: node, to: node, edge: null, key: node.nodeKey });
      }
      rows.sort((left, right) => left.time - right.time || left.to.name.localeCompare(right.to.name));
      return rows;
    }

    function sequenceGeometry() {
      const layers = LAYERS.filter(([id]) => state.layers.has(id));
      const colX = new Map(layers.map(([id], index) => [id, SEQUENCE_PAD + index * SEQUENCE_COL + SEQUENCE_COL / 2]));
      const rows = sequenceRows().filter((row) => colX.has(row.from.layer) && colX.has(row.to.layer));
      rows.forEach((row, index) => {
        row.y = SEQUENCE_HEAD + index * SEQUENCE_ROW + SEQUENCE_ROW / 2;
        row.x1 = colX.get(row.from.layer);
        row.x2 = colX.get(row.to.layer);
      });
      return {
        layers,
        colX,
        rows,
        width: Math.max(SEQUENCE_PAD * 2, layers.length * SEQUENCE_COL + SEQUENCE_PAD),
        height: SEQUENCE_HEAD + Math.max(rows.length, 1) * SEQUENCE_ROW + SEQUENCE_PAD,
      };
    }

    function sequenceSignature() {
      const nodes = visibleNodes().map((node) => node.nodeKey).join("\n");
      const edges = visibleEdges().map((edge) => `${edge.from}>${edge.to}:${edge.kind}:${edge.count}:${edge.followed || 0}:${edge.source}`).join("\n");
      const highlight = [...state.highlight].sort().join("\n");
      const layers = [...state.layers].sort().join("\n");
      return `${nodes}|${edges}|${highlight}|${layers}|${state.hover}|${state.focus}|${state.showNames}`;
    }

    function sequenceNeighbours() {
      const neighbours = new Set();
      if (!state.hover) return neighbours;
      neighbours.add(state.hover);
      for (const edge of visibleEdges()) {
        if (edge.from === state.hover) neighbours.add(edge.to);
        if (edge.to === state.hover) neighbours.add(edge.from);
      }
      return neighbours;
    }

    function shortName(name, full) {
      if (full || name.length <= 26) return name;
      return `${name.slice(0, 25)}…`;
    }

    function messageStyle(row, hot, flagged) {
      const edge = row.edge;
      const onFinding = state.highlight.has(row.from.nodeKey) || state.highlight.has(row.to.nodeKey);
      const duplicated = edge?.kind === "duplicated";
      const declared = edge?.source === "declared";
      const both = state.highlight.has(row.from.nodeKey) && state.highlight.has(row.to.nodeKey);
      const emphasise = flagged && onFinding && Boolean(edge) && (duplicated || both);
      const dim = (state.hover && !hot) || (flagged && !onFinding);
      let stroke = "#c8c2b6";
      let width = 1.25;
      let dash = "";
      if (emphasise) {
        stroke = "#ff5c5c";
        width = Math.min(4.5, 1.6 + Math.log2((edge.count || 1) + 1));
      } else if (onFinding) {
        stroke = "#ff5c5c";
        width = 1.8;
      } else if (declared) {
        stroke = "#e0b15a";
        dash = "5 4";
      } else if (duplicated) {
        stroke = "#ff8a8a";
        width = Math.min(4, 1.2 + Math.log2((edge.count || 1) + 1));
      }
      if (state.focus === row.key && !onFinding) stroke = "#fffaf0";
      return { stroke, width, dash, opacity: dim ? 0.18 : 1, onFinding };
    }

    function sequenceMarkup(model) {
      const neighbours = sequenceNeighbours();
      const flagged = state.highlight.size > 0;
      const lifelines = model.layers.map(([id, label, colour]) => {
        const x = model.colX.get(id);
        const marked = [...state.highlight].some((key) => state.nodes.get(key)?.layer === id);
        return `<line x1="${x}" y1="${SEQUENCE_HEAD - 8}" x2="${x}" y2="${model.height - 16}" stroke="${colour}" stroke-width="${marked ? 2 : 1}" opacity="${marked ? 0.9 : 0.45}" />` +
          `<g><rect x="${x - 58}" y="12" width="116" height="24" rx="12" fill="#12161ce6" stroke="${colour}" />` +
          `<text x="${x}" y="28" text-anchor="middle" fill="${colour}" font-size="12">${escapeText(label)}</text></g>`;
      }).join("");
      if (model.rows.length === 0) {
        return `${lifelines}<text x="${model.width / 2}" y="${SEQUENCE_HEAD + 28}" text-anchor="middle" fill="#8d939c" font-size="13">Nothing at the playhead yet.</text>`;
      }
      const messages = model.rows.map((row) => {
        const hot = !state.hover || neighbours.has(row.from.nodeKey) || neighbours.has(row.to.nodeKey);
        const ink = messageStyle(row, hot, flagged);
        const expanded = state.showNames || state.hover === row.to.nodeKey || state.highlight.has(row.to.nodeKey);
        const count = row.edge && row.edge.count > 1 ? ` ×${row.edge.count}` : "";
        const partial = row.edge && row.edge.followed && row.from.kind === "interaction" && row.from.count > 1 && row.edge.followed < row.from.count
          ? ` ${row.edge.followed}/${row.from.count}`
          : "";
        const label = escapeText(`${shortName(row.to.name, expanded)}${count}${partial}`);
        const colour = ink.onFinding ? "#ff5c5c" : (LAYER_COLOR[row.to.layer] || "#ddd");
        const same = row.from.layer === row.to.layer;
        let shape = "";
        if (!row.edge) {
          const fill = state.focus === row.key || ink.onFinding ? ink.stroke : colour;
          shape = `<rect x="${row.x1 - 5}" y="${row.y - 7}" width="10" height="14" rx="3" fill="${fill}" />` +
            `<text x="${row.x1}" y="${row.y - 12}" text-anchor="middle" fill="${ink.onFinding ? "#ffd0d0" : "#e8e4da"}" font-size="11">${label}</text>`;
        } else if (same) {
          const reach = 22;
          shape = `<path d="M ${row.x1} ${row.y - 6} H ${row.x1 + reach} V ${row.y + 6} H ${row.x1}" fill="none" stroke="${ink.stroke}" stroke-width="${ink.width}" stroke-dasharray="${ink.dash}" />` +
            `<polygon points="${row.x1},${row.y + 6} ${row.x1 + 7},${row.y + 2.5} ${row.x1 + 7},${row.y + 9.5}" fill="${ink.stroke}" />` +
            `<text x="${row.x1}" y="${row.y - 12}" text-anchor="middle" fill="${ink.onFinding ? "#ffd0d0" : "#e8e4da"}" font-size="11">${label}</text>`;
        } else {
          const direction = row.x2 >= row.x1 ? 1 : -1;
          const end = row.x2 - direction * 8;
          const mid = (row.x1 + end) / 2;
          shape = `<circle cx="${row.x1}" cy="${row.y}" r="3.2" fill="${ink.onFinding ? "#ff5c5c" : (LAYER_COLOR[row.from.layer] || "#ddd")}" />` +
            `<path d="M ${row.x1} ${row.y} H ${end}" fill="none" stroke="${ink.stroke}" stroke-width="${ink.width}" stroke-dasharray="${ink.dash}" />` +
            `<polygon points="${row.x2},${row.y} ${row.x2 - direction * 8},${row.y - 3.6} ${row.x2 - direction * 8},${row.y + 3.6}" fill="${ink.stroke}" />` +
            `<text x="${mid}" y="${row.y - 6}" text-anchor="middle" fill="${ink.onFinding ? "#ffd0d0" : "#e8e4da"}" font-size="11">${label}</text>`;
        }
        return `<g opacity="${ink.opacity}">${shape}</g>`;
      }).join("");
      return lifelines + messages;
    }

    function applySequenceTransform() {
      const world = document.getElementById("sequence-world");
      const host = document.getElementById("sequence");
      if (!world || !world.ownerSVGElement) return;
      const rect = host.getBoundingClientRect();
      world.ownerSVGElement.setAttribute("viewBox", `0 0 ${Math.max(rect.width, 1)} ${Math.max(rect.height, 1)}`);
      const { x, y, k } = state.sequenceCamera;
      world.setAttribute("transform", `translate(${rect.width / 2 - x * k} ${rect.height / 2 - y * k}) scale(${k})`);
    }

    function renderSequence() {
      const host = document.getElementById("sequence");
      const model = sequenceGeometry();
      state.sequenceModel = model;
      host.innerHTML = `<svg viewBox="0 0 ${Math.max(host.clientWidth, 1)} ${Math.max(host.clientHeight, 1)}" aria-hidden="true"><g id="sequence-world">${sequenceMarkup(model)}</g></svg>`;
      applySequenceTransform();
    }

    function sequenceWorld(event) {
      const rect = document.getElementById("sequence").getBoundingClientRect();
      const { x, y, k } = state.sequenceCamera;
      return {
        x: (event.clientX - rect.left - rect.width / 2) / k + x,
        y: (event.clientY - rect.top - rect.height / 2) / k + y,
      };
    }

    function hitSequence(event) {
      const model = state.sequenceModel;
      if (!model) return "";
      const world = sequenceWorld(event);
      let found = "";
      let best = SEQUENCE_ROW / 2;
      for (const row of model.rows) {
        const distance = Math.abs(world.y - row.y);
        if (distance > best) continue;
        const left = Math.min(row.x1, row.x2) - 12;
        const right = Math.max(row.x1, row.x2, row.x1 + 36) + 120;
        if (world.x < left || world.x > right) continue;
        best = distance;
        found = row.key;
      }
      return found;
    }

    function sequenceScale(rect, width) {
      return Math.max(0.8, Math.min(1.15, rect.width / (width + 36)));
    }

    function frameSequence(model, first, last) {
      const rect = document.getElementById("sequence").getBoundingClientRect();
      if (rect.width < 2 || rect.height < 2) return;
      const width = Math.max(64, model.width);
      const k = sequenceScale(rect, width);
      const viewHeight = rect.height / k;
      const top = first == null ? 0 : Math.max(0, SEQUENCE_HEAD + first * SEQUENCE_ROW - 12);
      const bottom = last == null ? model.height : SEQUENCE_HEAD + (last + 1) * SEQUENCE_ROW + 16;
      const height = Math.max(SEQUENCE_ROW, bottom - top);
      state.sequenceCamera.k = k;
      state.sequenceCamera.x = width / 2;
      state.sequenceCamera.y = height <= viewHeight ? top + height / 2 : top + viewHeight / 2;
      applySequenceTransform();
    }

    function fitSequence() {
      const model = state.sequenceModel || sequenceGeometry();
      frameSequence(model, null, null);
    }

    function fitSequenceHighlight() {
      const model = sequenceGeometry();
      state.sequenceModel = model;
      const indexes = [];
      model.rows.forEach((row, index) => {
        if (state.highlight.has(row.from.nodeKey) || state.highlight.has(row.to.nodeKey)) indexes.push(index);
      });
      if (indexes.length === 0) {
        frameSequence(model, null, null);
        return;
      }
      frameSequence(model, Math.min(...indexes), Math.max(...indexes));
    }

    function easeSequenceCamera() {
      const model = state.sequenceModel || sequenceGeometry();
      const rect = document.getElementById("sequence").getBoundingClientRect();
      if (rect.width < 2 || rect.height < 2) return;
      const width = Math.max(64, model.width);
      const k = sequenceScale(rect, width);
      const viewHeight = rect.height / k;
      const lastY = model.rows.length ? model.rows[model.rows.length - 1].y + SEQUENCE_ROW : model.height / 2;
      const targetY = Math.max(viewHeight / 2, lastY - viewHeight / 2 + SEQUENCE_ROW);
      state.sequenceCamera.x += (width / 2 - state.sequenceCamera.x) * 0.12;
      state.sequenceCamera.y += (targetY - state.sequenceCamera.y) * 0.12;
      state.sequenceCamera.k += (k - state.sequenceCamera.k) * 0.12;
    }

    function fitCurrent() {
      if (state.view === "sequence") fitSequence();
      else fit();
    }

    function fitCurrentHighlight() {
      if (state.view === "sequence") fitSequenceHighlight();
      else fitHighlight();
    }

    function setView(view) {
      state.view = view;
      state.drag = null;
      const wrap = document.getElementById("graph-wrap");
      wrap.dataset.view = view;
      wrap.setAttribute("aria-label", view === "sequence" ? "Sequence diagram" : "Dependency graph");
      document.getElementById("view-graph").setAttribute("aria-pressed", view === "graph" ? "true" : "false");
      document.getElementById("view-sequence").setAttribute("aria-pressed", view === "sequence" ? "true" : "false");
      if (view === "graph") {
        resize();
        draw();
        return;
      }
      state.sequenceSig = sequenceSignature();
      renderSequence();
      if (!state.drag) fitSequence();
    }

    function stepPhysics() {
      const nodes = visibleNodes();
      const edges = visibleEdges();
      for (let index = 0; index < nodes.length; index += 1) {
        for (let other = index + 1; other < nodes.length; other += 1) {
          const a = nodes[index];
          const b = nodes[other];
          let dx = a.x - b.x;
          let dy = a.y - b.y;
          let distance = Math.hypot(dx, dy);
          if (distance < 1) {
            dx = 1;
            dy = 0;
            distance = 36;
          } else if (distance < 36) {
            distance = 36;
          }
          const force = 1400 / (distance * distance);
          dx = (dx / distance) * force;
          dy = (dy / distance) * force;
          a.vx += dx;
          a.vy += dy;
          b.vx -= dx;
          b.vy -= dy;
        }
      }
      for (const edge of edges) {
        const a = state.nodes.get(edge.from);
        const b = state.nodes.get(edge.to);
        if (!a || !b) continue;
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const distance = Math.hypot(dx, dy) || 0.01;
        const force = (distance - 110) * 0.02;
        a.vx += (dx / distance) * force;
        a.vy += (dy / distance) * force;
        b.vx -= (dx / distance) * force;
        b.vy -= (dy / distance) * force;
      }
      for (const node of nodes) {
        if (state.drag === node.nodeKey) continue;
        node.vx += -node.x * 0.01;
        node.vy += -node.y * 0.01;
        node.vx *= 0.78;
        node.vy *= 0.78;
        const speed = Math.hypot(node.vx, node.vy);
        if (speed > 10) {
          node.vx = (node.vx / speed) * 10;
          node.vy = (node.vy / speed) * 10;
        }
        node.x += node.vx;
        node.y += node.vy;
      }
    }

    function resize() {
      const ratio = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = Math.max(1, Math.floor(rect.width * ratio));
      canvas.height = Math.max(1, Math.floor(rect.height * ratio));
      context.setTransform(ratio, 0, 0, ratio, 0, 0);
      layoutClips();
      placePlayhead();
    }

    function toScreen(x, y) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (x - state.camera.x) * state.camera.k + rect.width / 2,
        y: (y - state.camera.y) * state.camera.k + rect.height / 2,
      };
    }

    function toWorld(x, y) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (x - rect.width / 2) / state.camera.k + state.camera.x,
        y: (y - rect.height / 2) / state.camera.k + state.camera.y,
      };
    }

    function draw() {
      const rect = canvas.getBoundingClientRect();
      context.clearRect(0, 0, rect.width, rect.height);
      const nodes = visibleNodes();
      const keys = new Set(nodes.map((node) => node.nodeKey));
      const neighbours = new Set();
      if (state.hover) {
        neighbours.add(state.hover);
        for (const edge of visibleEdges()) {
          if (edge.from === state.hover) neighbours.add(edge.to);
          if (edge.to === state.hover) neighbours.add(edge.from);
        }
      }
      const flagged = state.highlight.size > 0;
      for (const edge of visibleEdges()) {
        const a = state.nodes.get(edge.from);
        const b = state.nodes.get(edge.to);
        if (!a || !b) continue;
        const from = toScreen(a.x, a.y);
        const to = toScreen(b.x, b.y);
        const declared = edge.source === "declared";
        const duplicated = edge.kind === "duplicated";
        const onFinding = state.highlight.has(edge.from) || state.highlight.has(edge.to);
        const hot = (!state.hover || neighbours.has(edge.from) || neighbours.has(edge.to))
          && (!flagged || onFinding || !duplicated);
        const emphasise = flagged && onFinding && (duplicated || (state.highlight.has(edge.from) && state.highlight.has(edge.to)));
        context.setLineDash(declared ? [5, 4] : []);
        if (emphasise) {
          context.strokeStyle = "#ff5c5ccc";
          context.lineWidth = Math.min(5, 1.4 + Math.log2(edge.count + 1));
        } else if (declared) {
          context.strokeStyle = hot ? "#e0b15acc" : "#e0b15a44";
          context.lineWidth = Math.min(3.5, 0.6 + Math.log2(edge.count + 1));
        } else if (duplicated) {
          context.strokeStyle = hot ? "#ff8a8a88" : "#ff8a8a22";
          context.lineWidth = Math.min(4, 0.8 + Math.log2(edge.count + 1));
        } else {
          context.strokeStyle = hot ? "#c8c2b688" : "#c8c2b622";
          context.lineWidth = Math.min(3.5, 0.6 + Math.log2(edge.count + 1));
        }
        context.beginPath();
        context.moveTo(from.x, from.y);
        context.lineTo(to.x, to.y);
        context.stroke();
        context.setLineDash([]);
      }
      for (const node of nodes) {
        if (!keys.has(node.nodeKey)) continue;
        const point = toScreen(node.x, node.y);
        const onFinding = state.highlight.has(node.nodeKey);
        const dim = (state.hover && !neighbours.has(node.nodeKey)) || (flagged && !onFinding);
        const radius = 5 + Math.min(9, Math.sqrt(node.count || 1) * 2);
        context.globalAlpha = dim ? 0.18 : 1;
        context.fillStyle = onFinding ? "#ff5c5c" : (LAYER_COLOR[node.layer] || "#ddd");
        context.beginPath();
        context.arc(point.x, point.y, radius, 0, Math.PI * 2);
        context.fill();
        if (onFinding || node.nodeKey === state.focus) {
          context.strokeStyle = onFinding ? "#ffd0d0" : "#fff";
          context.lineWidth = onFinding ? 2 : 1.5;
          context.stroke();
        }
        const labelled = state.showNames || neighbours.has(node.nodeKey) || onFinding;
        if (labelled) {
          context.fillStyle = onFinding ? "#ffd0d0" : "#e8e4da";
          context.font = "11px ui-sans-serif, system-ui, sans-serif";
          context.fillText(node.name, point.x + radius + 4, point.y + 3);
        }
        context.globalAlpha = 1;
      }
    }

    function hit(x, y) {
      const world = toWorld(x, y);
      let found = "";
      let best = 18 / state.camera.k;
      for (const node of visibleNodes()) {
        const distance = Math.hypot(node.x - world.x, node.y - world.y);
        if (distance < best) {
          best = distance;
          found = node.nodeKey;
        }
      }
      return found;
    }

    function consequenceSummary(node) {
      if (node.kind !== "interaction") return "";
      const outgoing = visibleEdges().filter((edge) => edge.from === node.nodeKey && edge.followed);
      if (outgoing.length === 0) return "";
      if ((node.count || 0) < 2) {
        return outgoing.length === 1 ? "1 consequence" : `${outgoing.length} consequences`;
      }
      const every = outgoing.filter((edge) => edge.followed >= node.count).length;
      const some = outgoing.length - every;
      const everyWord = every === 1 ? "1 every time" : `${every} every time`;
      const someWord = some === 1 ? "1 some of the time" : `${some} some of the time`;
      if (every === 0) return someWord;
      if (some === 0) return everyWord;
      return `${everyWord} · ${someWord}`;
    }

    function showTip(node, clientX, clientY) {
      if (!node) {
        tip.style.display = "none";
        return;
      }
      const links = visibleEdges().filter((edge) => edge.from === node.nodeKey || edge.to === node.nodeKey);
      const host = document.getElementById("graph-wrap").getBoundingClientRect();
      tip.style.display = "block";
      tip.style.left = `${clientX - host.left + 14}px`;
      tip.style.top = `${clientY - host.top + 14}px`;
      const service = node.service ? `${node.service} · ` : "";
      const times = node.count === 1 ? "1 time" : `${node.count} times`;
      const consequences = consequenceSummary(node);
      const detail = consequences || (links.length === 1 ? "1 link" : `${links.length} links`);
      tip.textContent = `${node.name}\n${service}${LAYER_LABEL[node.layer] || node.layer} · ${node.kind} · seen ${times}\n${detail}`;
    }

    function fit(nodes) {
      const targets = Array.isArray(nodes) ? nodes : visibleNodes();
      if (targets.length === 0) return;
      const xs = targets.map((node) => node.x);
      const ys = targets.map((node) => node.y);
      state.camera.x = (Math.min(...xs) + Math.max(...xs)) / 2;
      state.camera.y = (Math.min(...ys) + Math.max(...ys)) / 2;
      const rect = canvas.getBoundingClientRect();
      const width = Math.max(...xs) - Math.min(...xs) + 160;
      const height = Math.max(...ys) - Math.min(...ys) + 160;
      state.camera.k = Math.max(0.12, Math.min(1.8, Math.min(rect.width / width, rect.height / height)));
    }

    function fitHighlight() {
      const targets = visibleNodes().filter((node) => state.highlight.has(node.nodeKey));
      fit(targets.length > 0 ? targets : null);
    }

    function frameTarget() {
      const nodes = visibleNodes();
      if (nodes.length === 0) return null;
      const xs = nodes.map((node) => node.x);
      const ys = nodes.map((node) => node.y);
      const rect = canvas.getBoundingClientRect();
      const width = Math.max(...xs) - Math.min(...xs) + 180;
      const height = Math.max(...ys) - Math.min(...ys) + 180;
      return {
        x: (Math.min(...xs) + Math.max(...xs)) / 2,
        y: (Math.min(...ys) + Math.max(...ys)) / 2,
        k: Math.max(0.12, Math.min(1.8, Math.min(rect.width / width, rect.height / height))),
      };
    }

    function easeCamera() {
      const target = frameTarget();
      if (!target || state.drag) return;
      state.camera.x += (target.x - state.camera.x) * 0.12;
      state.camera.y += (target.y - state.camera.y) * 0.12;
      state.camera.k += (target.k - state.camera.k) * 0.12;
    }

    function settleNewNodes() {
      const nodes = visibleNodes();
      const fresh = nodes.filter((node) => !state.laidOut.has(node.nodeKey));
      const known = nodes.filter((node) => state.laidOut.has(node.nodeKey));
      if (fresh.length > 0 && known.length > 0) {
        const originX = known.reduce((sum, node) => sum + node.x, 0) / known.length;
        const originY = known.reduce((sum, node) => sum + node.y, 0) / known.length;
        for (const node of fresh) {
          const angle = hash(node.nodeKey);
          node.x = originX + Math.cos(angle) * 48;
          node.y = originY + Math.sin(angle) * 48;
          node.vx = 0;
          node.vy = 0;
        }
      }
      const live = new Set(nodes.map((node) => node.nodeKey));
      for (const node of nodes) state.laidOut.add(node.nodeKey);
      for (const key of state.laidOut) {
        if (!live.has(key)) state.laidOut.delete(key);
      }
    }

    async function refresh() {
      const [traces, graph, findings] = await Promise.all([
        fetch("/v1/traces").then((response) => response.json()),
        fetch("/v1/graph").then((response) => response.json()),
        fetch("/v1/findings").then((response) => response.json()),
      ]);
      state.traces = traces.traces;
      state.findings = findings.findings;
      syncHighlight();
      const listed = listedTraces();
      const selectedBefore = state.selected;
      if (!state.playing && state.cursor == null && state.live && listed.length > 0) {
        const ranked = [...listed].sort((left, right) => latestActivity(left) - latestActivity(right));
        state.selected = ranked.at(-1)?.traceId || "";
      } else if (!listed.some((trace) => trace.traceId === state.selected)) {
        const ranked = [...listed].sort((left, right) => interest(left) - interest(right));
        state.selected = ranked.at(-1)?.traceId || "";
      }
      const visibleBefore = new Set(visibleNodes().map((node) => node.nodeKey));
      syncGraph(graph);
      const grew = visibleNodes().some((node) => !visibleBefore.has(node.nodeKey));
      if ((grew || state.selected !== selectedBefore) && !state.drag && !state.playing) requestAnimationFrame(fitCurrent);
      const nodes = visibleNodes().length;
      const edges = visibleEdges().length;
      if (!state.reading) {
        document.getElementById("status").textContent = statusText(nodes, edges);
      }
      renderTraces();
      renderTimeline();
      renderFindings();
    }

    function statusText(nodes, edges) {
      const declared = state.edges.filter((edge) => edge.source === "declared").length;
      const base = nodes === 0
        ? "The graph is built from the app as you use it. Nothing has been recorded yet."
        : `${listedTraces().length} traces · ${nodes} nodes · ${edges} links on the graph.`;
      const read = declared ? ` ${declared} read from source.` : "";
      const note = state.sourceNote ? ` ${state.sourceNote}` : "";
      const picture = `${base}${read}${note}`;
      if (state.playing) return `Playing. The picture matches the playhead. ${picture}`;
      if (state.cursor != null) return `Set to the playhead. ${picture}`;
      return picture;
    }

    function syncTransport() {
      const button = document.getElementById("transport");
      const playing = state.playing;
      button.setAttribute("aria-pressed", playing ? "true" : "false");
      button.setAttribute("aria-label", playing ? "Pause" : "Play");
      button.title = playing ? "Pause" : "Play";
    }

    function stopPlayback(clearCursor) {
      state.playing = false;
      cancelAnimationFrame(state.playAnim);
      if (clearCursor) state.cursor = null;
      syncTransport();
    }

    function restartTimeline() {
      const arranged = buildArrangement();
      if (arranged.stories.length === 0) return;
      stopPlayback(false);
      state.live = false;
      document.getElementById("live").setAttribute("aria-pressed", "false");
      state.cursor = 0;
      state.highWater = null;
      paintPlayback();
      placePlayhead();
      if (!state.drag) fitCurrent();
    }

    function paintPlayback() {
      renderTraces();
      renderTimeline();
      renderFindings();
      if (!state.reading) {
        document.getElementById("status").textContent = statusText(visibleNodes().length, visibleEdges().length);
      }
    }

    function playbackFrame(now) {
      if (!state.playing) return;
      const arranged = buildArrangement();
      if (arranged.stories.length === 0) {
        stopPlayback(true);
        paintPlayback();
        return;
      }
      const distance = Math.max(0, state.playTo - state.playFrom);
      const travel = Math.max(1600, Math.min(9000, (distance / Math.max(arranged.end, 1)) * 7000));
      const t = Math.min(1, (now - state.playWall) / travel);
      state.cursor = state.playFrom + distance * t;
      placePlayhead();
      layoutClips();
      if (t >= 1) {
        stopPlayback(true);
        paintPlayback();
        if (!state.drag) requestAnimationFrame(fitCurrent);
        return;
      }
      if (now - (state.playDrawn || 0) > 70) {
        state.playDrawn = now;
        renderTraces();
        renderFindings();
        const after = visibleNodes();
        if (!state.reading) {
          document.getElementById("status").textContent = statusText(after.length, visibleEdges().length);
        }
      }
      state.playAnim = requestAnimationFrame(playbackFrame);
    }

    function timeAt(event) {
      const ruler = document.getElementById("ruler");
      const arranged = buildArrangement();
      if (arranged.stories.length === 0) return null;
      const rect = ruler.getBoundingClientRect();
      if (rect.width === 0) return null;
      const fraction = Math.min(1, Math.max(0, (event.clientX - rect.left) / rect.width));
      return fraction * arranged.end;
    }

    let scrubbing = false;

    function scrub(event) {
      const time = timeAt(event);
      if (time == null) return;
      if (state.playing) stopPlayback(false);
      state.live = false;
      document.getElementById("live").setAttribute("aria-pressed", "false");
      state.cursor = time;
      paintPlayback();
    }

    function beginScrub(event) {
      scrubbing = true;
      event.currentTarget.setPointerCapture(event.pointerId);
      scrub(event);
    }

    document.getElementById("ruler").addEventListener("pointerdown", beginScrub);
    document.querySelector(".playhead-cap").addEventListener("pointerdown", (event) => {
      event.stopPropagation();
      beginScrub(event);
    });
    window.addEventListener("pointermove", (event) => {
      if (scrubbing) scrub(event);
    });
    window.addEventListener("pointerup", () => {
      scrubbing = false;
    });

    document.getElementById("restart").addEventListener("click", restartTimeline);

    document.getElementById("transport").addEventListener("click", () => {
      if (state.playing) {
        stopPlayback(false);
        paintPlayback();
        return;
      }
      const arranged = buildArrangement();
      if (arranged.stories.length === 0) return;
      state.live = false;
      document.getElementById("live").setAttribute("aria-pressed", "false");
      state.scope = "all";
      const scope = document.getElementById("scope");
      scope.setAttribute("aria-pressed", "false");
      scope.textContent = "All activity";
      if (state.cursor == null || state.cursor >= arranged.end - 0.5) state.cursor = 0;
      state.playFrom = state.cursor;
      state.playTo = arranged.end;
      state.playWall = performance.now();
      state.playing = true;
      syncTransport();
      paintPlayback();
      if (!state.drag) requestAnimationFrame(fit);
      state.playAnim = requestAnimationFrame(playbackFrame);
    });

    document.getElementById("read-source").addEventListener("click", async () => {
      const button = document.getElementById("read-source");
      state.reading = true;
      button.disabled = true;
      document.getElementById("status").textContent = "Reading source…";
      try {
        const response = await fetch("/v1/declared", { method: "POST" });
        const body = await response.json();
        state.sourceNote = typeof body.note === "string" ? body.note : "";
      } catch {
        state.sourceNote = "Source could not be read.";
      }
      state.reading = false;
      button.disabled = false;
      refresh();
    });

    document.getElementById("traces").addEventListener("click", (event) => {
      const button = event.target.closest("button[data-trace]");
      if (!button) return;
      state.selected = button.dataset.trace;
      stopPlayback(true);
      state.live = false;
      document.getElementById("live").setAttribute("aria-pressed", "false");
      state.scope = "trace";
      document.getElementById("scope").setAttribute("aria-pressed", "true");
      document.getElementById("scope").textContent = "This trace";
      renderTraces();
      renderTimeline();
      renderFindings();
      fitCurrent();
    });

    document.getElementById("tracks").addEventListener("click", (event) => {
      const bar = event.target.closest("button[data-node]");
      if (!bar) return;
      state.focus = bar.dataset.node;
      if (state.view === "sequence") {
        const model = sequenceGeometry();
        const index = model.rows.findIndex((row) => row.key === state.focus || row.from.nodeKey === state.focus);
        state.sequenceSig = "";
        if (index >= 0) frameSequence(model, index, index);
        return;
      }
      const node = state.nodes.get(state.focus);
      if (node) {
        state.camera.x = node.x;
        state.camera.y = node.y;
      }
    });

    document.getElementById("findings").addEventListener("click", (event) => {
      const button = event.target.closest("button[data-finding]");
      if (!button) return;
      const closing = state.openFinding === button.dataset.finding;
      state.openFinding = closing ? "" : button.dataset.finding;
      syncHighlight();
      stopPlayback(false);
      state.live = false;
      document.getElementById("live").setAttribute("aria-pressed", "false");
      const scope = document.getElementById("scope");
      if (closing) {
        state.scope = "all";
        scope.setAttribute("aria-pressed", "false");
        scope.textContent = "All activity";
      } else {
        state.selected = button.dataset.trace;
        state.scope = "trace";
        scope.setAttribute("aria-pressed", "true");
        scope.textContent = "This trace";
      }
      paintPlayback();
      placePlayhead();
      if (state.highlight.size > 0) fitCurrentHighlight();
      else fitCurrent();
    });

    document.getElementById("search").addEventListener("input", (event) => {
      state.query = event.target.value.trim().toLowerCase();
    });

    const exportButton = document.getElementById("export");
    const exportMenu = document.getElementById("export-menu");

    function closeExportMenu() {
      exportMenu.hidden = true;
      exportButton.setAttribute("aria-expanded", "false");
    }

    function downloadReport(format) {
      const params = new URLSearchParams();
      params.set("format", format);
      params.set("assets", state.hideAssets ? "0" : "1");
      const includeEvents = document.getElementById("include-events");
      if (includeEvents instanceof HTMLInputElement && includeEvents.checked) {
        params.set("events", "1");
      }
      if (state.scope === "trace" && state.selected) {
        params.set("trace", state.selected);
      }
      const link = document.createElement("a");
      link.href = `/v1/report?${params}`;
      link.download = "";
      link.click();
    }

    exportButton.addEventListener("click", (event) => {
      event.stopPropagation();
      const open = exportMenu.hidden;
      exportMenu.hidden = !open;
      exportButton.setAttribute("aria-expanded", open ? "true" : "false");
    });

    exportMenu.addEventListener("click", (event) => {
      const choice = event.target.closest("[data-format]");
      if (!choice) return;
      downloadReport(choice.dataset.format || "md");
      closeExportMenu();
    });

    document.addEventListener("click", (event) => {
      if (!event.target.closest(".menu")) closeExportMenu();
    });

    document.getElementById("reset").addEventListener("click", async () => {
      await fetch("/v1/events", { method: "DELETE" });
      state.traces = [];
      state.findings = [];
      state.nodes.clear();
      state.edges = [];
      state.selected = "";
      state.focus = "";
      state.openFinding = "";
      state.highlight = new Set();
      state.live = true;
      state.sourceNote = "";
      stopPlayback(true);
      document.getElementById("live").setAttribute("aria-pressed", "true");
      renderTraces();
      renderTimeline();
      renderFindings();
      document.getElementById("status").textContent =
        "Cleared. The next thing you do in the app starts a new recording.";
    });

    const HELP = {
      traces: "Each row is one story: a click or a job, and everything that shared its trace. Select a row to hold that story still. That turns Live off.",
      timeline: "The ruler is the whole recording, with the long pauses between clicks taken out so the clips sit together. The orange line is the playhead. Press restart to jump to the start, like skip back in a music player. Press the round play control to walk forward, and press it again to pause. Drag the ruler or the playhead triangle to an exact moment. Clips that have not happened yet stay hidden. This trace, Hide assets and the layer buttons can narrow the picture. Live parks the playhead at the end.",
      view: "Graph draws each thing that ran as a dot. Sequence draws the same things in time order, with a column for each part of the stack. Both use the playhead, the findings and these filters. Switching does not clear them. Only the drawing on screen is painted.",
      graph: "Each dot is something that ran. Once the playhead has reached it, the dot stays while playback moves forward. A line means one event recorded that it happened inside another, or because of another. A click is the cause of the browser call that follows it. Hover that click to count what followed it. After a second press, the count splits into every time and some of the time. A request that carried another request's span id is the cause of that next hop. A rose line is duplicated work: the same request or query ran again, and its thickness follows the count. A dashed line was read from the source when you pressed Read source, and it appears only when both ends have already run. Sharing a trace does not draw a line, so jobs and worker can be in the same story with nothing joining them. Drag the background to move around, scroll to zoom, and drag a dot to pin it. Hover a dot to see what it connects to. Names starts off. Sequence switches this panel to a sequence diagram of the same dots.",
      names: "Shows the full name beside every dot, and the full name on every sequence message, including while a finding is open. It starts off. With it off, hovering a dot still names that dot and every dot joined to it. Sequence messages keep a short name either way.",
      search: "Type part of a name to hide dots that do not match. Clear the box to show them again.",
      live: "Follows whatever just happened and recentres the picture. Choosing a trace in the list turns this off. Press it again to follow the newest story.",
      scope: "This trace shows only the story selected on the left, plus anything already joined to it by a line. All activity shows every story from this session. Press Fit if the extra dots sit outside the view. Hide assets is on by default, so many of those extra dots stay hidden.",
      layers: "Each button hides or shows dots from that part of the stack. They all start on.",
      assets: "Hides files Next.js loads just to draw the page: names containing /_next/ or webpack. It starts on. Turn it off to see those files, then press Fit.",
      fit: "Recentres and zooms so everything currently shown fits on the screen. While a finding is open, Fit frames the highlighted dots or messages.",
      findings: "Notes about what looks off in a story, such as a query that ran many times. Open one to paint its nodes red, emphasise duplicated links, select its trace and turn Live off. The playhead stays where it is. The sequence diagram paints those same messages red. Click the finding again to clear the highlight and show the whole graph at that same moment.",
    };

    const help = document.getElementById("help");

    function closeHelp() {
      help.hidden = true;
      help.dataset.for = "";
      for (const button of document.querySelectorAll(".info[aria-expanded='true']")) {
        button.setAttribute("aria-expanded", "false");
      }
    }

    function openHelp(button) {
      const id = button.dataset.help;
      closeHelp();
      help.hidden = false;
      help.dataset.for = id;
      help.textContent = HELP[id] || "";
      const rect = button.getBoundingClientRect();
      const width = 280;
      help.style.left = `${Math.max(8, Math.min(rect.left, window.innerWidth - width - 8))}px`;
      help.style.top = `${Math.min(rect.bottom + 8, window.innerHeight - 120)}px`;
    }

    for (const button of document.querySelectorAll(".info")) {
      button.addEventListener("pointerenter", () => openHelp(button));
      button.addEventListener("pointerleave", closeHelp);
    }

    document.getElementById("live").addEventListener("click", (event) => {
      const follow = !state.live;
      if (follow) stopPlayback(true);
      state.live = follow;
      event.target.setAttribute("aria-pressed", state.live ? "true" : "false");
      if (state.live) refresh();
    });

    document.getElementById("scope").addEventListener("click", (event) => {
      state.scope = state.scope === "trace" ? "all" : "trace";
