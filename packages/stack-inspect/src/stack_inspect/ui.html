      event.target.setAttribute("aria-pressed", state.scope === "trace" ? "true" : "false");
      event.target.textContent = state.scope === "trace" ? "This trace" : "All activity";
      fitCurrent();
    });

    document.getElementById("assets").addEventListener("click", (event) => {
      state.hideAssets = !state.hideAssets;
      event.target.setAttribute("aria-pressed", state.hideAssets ? "true" : "false");
    });

    document.getElementById("names").addEventListener("click", (event) => {
      state.showNames = !state.showNames;
      event.target.setAttribute("aria-pressed", state.showNames ? "true" : "false");
    });

    for (const button of document.querySelectorAll("[data-layer]")) {
      button.addEventListener("click", () => {
        const layer = button.dataset.layer;
        if (state.layers.has(layer)) state.layers.delete(layer);
        else state.layers.add(layer);
        button.setAttribute("aria-pressed", state.layers.has(layer) ? "true" : "false");
      });
    }

    document.getElementById("fit").addEventListener("click", () => {
      if (state.highlight.size > 0) fitCurrentHighlight();
      else fitCurrent();
    });

    document.getElementById("view-graph").addEventListener("click", () => setView("graph"));
    document.getElementById("view-sequence").addEventListener("click", () => setView("sequence"));

    canvas.addEventListener("wheel", (event) => {
      event.preventDefault();
      const before = toWorld(event.offsetX, event.offsetY);
      state.camera.k = Math.max(0.25, Math.min(3, state.camera.k * (event.deltaY < 0 ? 1.08 : 0.92)));
      const after = toWorld(event.offsetX, event.offsetY);
      state.camera.x += before.x - after.x;
      state.camera.y += before.y - after.y;
    }, { passive: false });

    canvas.addEventListener("pointerdown", (event) => {
      const key = hit(event.offsetX, event.offsetY);
      state.drag = key || "pan";
      state.focus = key;
      canvas.classList.add("dragging");
      canvas.setPointerCapture(event.pointerId);
    });

    canvas.addEventListener("pointermove", (event) => {
      if (!state.drag) {
        state.hover = hit(event.offsetX, event.offsetY);
        showTip(state.nodes.get(state.hover), event.clientX, event.clientY);
        return;
      }
      if (state.drag === "pan") {
        state.camera.x -= event.movementX / state.camera.k;
        state.camera.y -= event.movementY / state.camera.k;
        return;
      }
      const node = state.nodes.get(state.drag);
      if (!node) return;
      const world = toWorld(event.offsetX, event.offsetY);
      node.x = world.x;
      node.y = world.y;
      node.vx = 0;
      node.vy = 0;
    });

    canvas.addEventListener("pointerup", () => {
      state.drag = null;
      canvas.classList.remove("dragging");
    });

    canvas.addEventListener("pointerleave", () => {
      if (!state.drag) {
        state.hover = "";
        tip.style.display = "none";
      }
    });

    const sequence = document.getElementById("sequence");

    sequence.addEventListener("wheel", (event) => {
      if (state.view !== "sequence") return;
      event.preventDefault();
      const before = sequenceWorld(event);
      const rect = sequence.getBoundingClientRect();
      state.sequenceCamera.k = Math.max(0.35, Math.min(2.4, state.sequenceCamera.k * (event.deltaY < 0 ? 1.08 : 0.92)));
      state.sequenceCamera.x = before.x - (event.clientX - rect.left - rect.width / 2) / state.sequenceCamera.k;
      state.sequenceCamera.y = before.y - (event.clientY - rect.top - rect.height / 2) / state.sequenceCamera.k;
      applySequenceTransform();
    }, { passive: false });

    sequence.addEventListener("pointerdown", (event) => {
      if (state.view !== "sequence") return;
      state.focus = hitSequence(event);
      state.drag = "pan";
      state.hover = "";
      tip.style.display = "none";
      state.sequencePan = { x: event.clientX, y: event.clientY };
      sequence.classList.add("dragging");
      sequence.setPointerCapture(event.pointerId);
      state.sequenceSig = "";
    });

    sequence.addEventListener("pointermove", (event) => {
      if (state.view !== "sequence") return;
      if (state.drag === "pan") {
        const scale = state.sequenceCamera.k || 1;
        state.sequenceCamera.x -= (event.clientX - state.sequencePan.x) / scale;
        state.sequenceCamera.y -= (event.clientY - state.sequencePan.y) / scale;
        state.sequencePan = { x: event.clientX, y: event.clientY };
        applySequenceTransform();
        return;
      }
      const hovered = hitSequence(event);
      if (hovered !== state.hover) {
        state.hover = hovered;
        state.sequenceSig = "";
      }
      showTip(state.nodes.get(state.hover), event.clientX, event.clientY);
    });

    sequence.addEventListener("pointerup", () => {
      state.drag = null;
      sequence.classList.remove("dragging");
    });

    sequence.addEventListener("pointerleave", () => {
      if (state.drag === "pan") return;
      state.hover = "";
      tip.style.display = "none";
      state.sequenceSig = "";
    });

    window.addEventListener("resize", () => {
      resize();
      fitCurrent();
    });
    resize();
    function frame() {
      if (state.view === "sequence") {
        if (state.playing && !state.drag) easeSequenceCamera();
        const signature = sequenceSignature();
        if (signature !== state.sequenceSig) {
          state.sequenceSig = signature;
          renderSequence();
        } else if (state.playing || state.drag) {
          applySequenceTransform();
        }
      } else {
        stepPhysics();
        settleNewNodes();
        if (state.playing) easeCamera();
        draw();
      }
      requestAnimationFrame(frame);
    }
    frame();
    refresh();
    setInterval(refresh, 1000);
  </script>
</body>
</html>
