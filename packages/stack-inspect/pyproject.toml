[project]
name = "stack-inspect"
version = "1.0.0"
description = "Local collector and UI for the stack-inspect execution graph"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fastapi>=0.115",
  "stack-inspect-core",
  "uvicorn>=0.34",
]

[project.scripts]
stack-inspect = "stack_inspect.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stack_inspect"]

[tool.hatch.build.targets.wheel.force-include]
"src/stack_inspect/ui.html" = "stack_inspect/ui.html"
